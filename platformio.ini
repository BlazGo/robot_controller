; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
;pico
;rpipico2w
;solderparty_rp2350_stamp_xl
board = solderparty_rp2350_stamp_xl 
framework = arduino
board_build.core = earlephilhower
;board_build.filesystem_size = 1.0m
; need this build flag if we're using FreeRTOS
build_flags =
	-DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
	-DBUILD_TIMESTAMP=$UNIX_TIME
; change MCU frequency
board_build.f_cpu = 150000000L
extra_scripts = 
	pre:buildscript_versioning.py
lib_deps = 
	https://github.com/waspinator/AccelStepper
	https://github.com/I-AM-ENGINEER/MT6701-arduino
	https://github.com/eecharlie/MatrixMath
	https://github.com/adafruit/Adafruit_BusIO.git
	https://github.com/adafruit/Adafruit-GFX-Library.git
	https://github.com/adafruit/Adafruit_SSD1306.git
